server:
  port: ${CRM_SERVER_PORT:8080}
  tomcat:
    threads:
      max: 200
    uri-encoding: UTF-8

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: shangxu-crm
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 优先读环境变量（Docker/服务器），没有则读 application-dev.yml 里的 shangxuyun.* 配置
    url: jdbc:mysql://${MYSQL_HOST:${shangxuyun.mysql.host:localhost}}:${MYSQL_PORT:${shangxuyun.mysql.port:3306}}/${MYSQL_DB:${shangxuyun.mysql.db:shangxu_crm}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${MYSQL_USER:${shangxuyun.mysql.username:root}}
    password: ${MYSQL_PASSWORD:${shangxuyun.mysql.password:root}}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: shangxuHikariPool
  data:
    redis:
      host: ${REDIS_HOST:${shangxuyun.redis.host:localhost}}
      port: ${REDIS_PORT:${shangxuyun.redis.port:6379}}
      # 本地 Redis 一般没有密码，留空即可；有密码时在 application-dev.yml 里填
      password: ${REDIS_PASSWORD:${shangxuyun.redis.password:}}
      database: ${REDIS_DB:${shangxuyun.redis.redisdb:0}}
      timeout: 5s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.shangxu.crm
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

crm:
  jwt:
    # 生产环境请通过环境变量 CRM_JWT_SECRET 覆盖
    secret: ${CRM_JWT_SECRET:${shangxuyun.crm.jwt.secret:CHANGE_ME_BEFORE_DEPLOY_AT_LEAST_32_CHARS_LONG}}
    # token 有效期（秒），默认 8 小时
    expire: ${shangxuyun.crm.jwt.expire:28800}
    header: Authorization
    prefix: "Bearer "
  cors:
    allowed-origins: ${CRM_CORS_ORIGINS:${shangxuyun.crm.cors.allowed-origins:http://localhost:*,http://127.0.0.1:*,http://localhost,http://127.0.0.1}}
  upload:
    # 附件存储目录，生产环境建议挂载独立数据盘
    dir: ${CRM_UPLOAD_DIR:./data/uploads}
  pool:
    # 私海客户超过 N 天未跟进自动回收至公海，0 表示关闭
    recycle-days: ${CRM_POOL_RECYCLE_DAYS:30}
  scheduler:
    # 多实例部署时只让一个实例开启，避免重复推送
    enabled: ${CRM_SCHEDULER_ENABLED:true}
    follow-remind-hours: ${CRM_FOLLOW_REMIND_HOURS:24}
    receivable-cron: ${CRM_CRON_RECEIVABLE:0 0 9 * * ?}
    follow-cron: ${CRM_CRON_FOLLOW:0 5 9 * * ?}
    pool-cron: ${CRM_CRON_POOL:0 10 9 * * ?}

logging:
  level:
    root: info
    com.shangxu.crm: info
    org.springframework.security: warn
