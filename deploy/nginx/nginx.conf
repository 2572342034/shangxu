# =============================================================
#  商序云 CRM · Nginx 统一入口
#  职责：静态资源托管 + API 反向代理负载均衡 + 限流保护
#
#  为什么用 least_conn 而不是默认轮询：
#    轮询不考虑节点当前负载，某个请求卡在 backend1 上时，
#    轮询仍会把新请求均分过去，慢请求越堆越多 → 雪崩。
#    least_conn 优先转发给连接数最少的节点，能自动避开慢节点。
# =============================================================

upstream crm_backend {
    least_conn;

    # 被动健康检查：连续 3 次失败后摘除 30 秒
    server backend1:8080 max_fails=3 fail_timeout=30s;
    server backend2:8080 max_fails=3 fail_timeout=30s;

    # 与后端保持长连接，省掉每次请求的 TCP 握手
    keepalive 32;
    keepalive_timeout 60s;
}

# 单 IP 限流：正常 30 请求/秒，突发允许 60 个
limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
# 单 IP 并发连接上限
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# 限流触发时返回 429（默认是 503，会被前端当成服务端故障）
limit_req_status  429;
limit_conn_status 429;

server {
    listen       80;
    server_name  _;
    charset utf-8;

    root   /usr/share/nginx/html;
    index  index.html;

    # 与 Spring multipart max-request-size 对齐
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # ---------- 网关自身健康检查 ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- 导出类接口：耗时长、要流式下发 ----------
    # 正则 location 优先于前缀 location，必须放在 /api/ 之前
    location ~ ^/api/(data|exports?)/ {
        limit_req zone=api_rate burst=10 nodelay;

        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout    180s;   # 万行 CSV 生成留足时间
        proxy_buffering       off;    # 边生成边下发，不占网关内存
    }

    # ---------- API 反向代理 ----------
    location /api/ {
        limit_req  zone=api_rate burst=60 nodelay;
        limit_conn api_conn 50;

        proxy_pass http://crm_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection          "";
        proxy_set_header Host                $host;
        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto   $scheme;

        # 快速失败：不把请求堆在网关上等后端
        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;

        # 故障转移：某节点 5xx 或超时，自动换另一个节点重试
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 10s;

        # 响应缓冲：慢客户端不会长时间占住后端工作线程
        proxy_buffering on;
        proxy_buffers   8 16k;
        proxy_buffer_size 32k;
    }

    # ---------- 接口文档 ----------
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://crm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # ---------- 静态资源 ----------
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;

    # 限流触发时返回 429，前端可据此提示"操作过于频繁"
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        return 429 '{"code":429,"msg":"请求过于频繁，请稍后再试"}';
    }
}
