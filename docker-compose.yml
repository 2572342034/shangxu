# =============================================================
#  商序云 CRM · 容器编排（双后端 + Nginx 负载均衡）
#
#  访问链路：浏览器 → nginx(frontend:80) → upstream → backend1 / backend2
#  后端不再直接对外暴露端口，统一从 80 入口进。
# =============================================================

# 后端公共环境变量
x-backend-env: &backend-env
  TZ: Asia/Shanghai
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_DB: shangxu_crm
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  # 必须通过 .env 或环境变量注入，仓库内不保留可用密钥
  CRM_JWT_SECRET: ${CRM_JWT_SECRET:-CHANGE_ME_BEFORE_DEPLOY_AT_LEAST_32_CHARS_LONG}
  CRM_CORS_ORIGINS: ${CRM_CORS_ORIGINS:-http://localhost}
  CRM_UPLOAD_DIR: /app/data/uploads
  CRM_SCHEDULER_ENABLED: "true"
  CRM_POOL_RECYCLE_DAYS: ${CRM_POOL_RECYCLE_DAYS:-30}
  JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}

# 后端公共配置
x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  environment:
    <<: *backend-env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    # 两个实例挂同一个命名卷：单宿主机下共享附件目录
    # 多宿主机部署必须换成对象存储（MinIO/OSS），否则 A 机传的文件 B 机读不到
    - shangxu-uploads:/app/data/uploads
  expose:
    - "8080"
  networks:
    - shangxu

services:
  mysql:
    image: mysql:8.0
    container_name: shangxu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: shangxu_crm
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --lower-case-table-names=0
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - shangxu

  redis:
    image: redis:7-alpine
    container_name: shangxu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - shangxu

  # ---------- 后端实例 1（承担定时任务）----------
  backend1:
    <<: *backend-base
    container_name: shangxu-backend1

  # ---------- 后端实例 2（关闭定时任务，避免重复执行）----------
  backend2:
    <<: *backend-base
    container_name: shangxu-backend2
    environment:
      <<: *backend-env
      CRM_SCHEDULER_ENABLED: "false"

  # ---------- Nginx：静态资源 + 负载均衡 + 限流 ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shangxu-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # 网关配置外置：改完 docker compose exec frontend nginx -s reload 即生效，无需重建镜像
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - shangxu

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  shangxu-uploads:
    driver: local

networks:
  shangxu:
    driver: bridge
